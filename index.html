<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="header">
        <div class="header__logo">
          <span class="header__logo-icon"></span>
          <div class="header__logo-text">
            <h1>QUIZ & POKER</h1>
            <p>KNOWLEDGE. LUCK. GLORY.</p>
          </div>
        </div>
        <button class="header__rating-btn">Rating</button>
      </header>

      <main class="main">

        <div class="progress">
          <span class="progress__label">Question 3 out of 10</span>
          <div class="progress__bar">
            <div class="progress__fill"></div>
          </div>
        </div>

        <div class="question-card">
          <p class="question-card__text"></p>
          <div class="timer">
            <span class="timer__value">12</span>
            <span class="timer__label">sec.</span>
          </div>
        </div>

        <div class="answers-grid"></div>

        <button class="next-btn hidden">NEXT QUESTION →</button>

        <div class="final-screen hidden">
          <h2 class="final-screen__title">GAME OVER</h2>
          <p class="final-screen__label">YOUR SCORE</p>
          <span class="final-screen__score">✦ 0</span>
          <button class="restart-btn">PLAY AGAIN</button>
        </div>

        <footer class="footer">
          <p>© 2026 Quiz & Poker. All rights reserved.</p>
        </footer>

      </main>

      <aside class="sidebar">
        <div class="sidebar__card">
          <span class="sidebar__card-label">Score</span>
          <span class="sidebar__card-value"></span>
        </div>
        <div class="sidebar__card">
          <span class="sidebar__card-label">Until the next lootbox</span>
          <span class="sidebar__card-value">650 / 1000</span>
          <div class="sidebar__progress-bar">
            <div class="progress__fill"></div>
          </div>
        </div>
        <div class="sidebar__card">
          <span class="sidebar__card-label">Opened lootboxes</span>
          <span class="sidebar__card-value">1 / 3</span>
        </div>
        <div class="sidebar__card">
          <span class="sidebar__card-label">Active luck multiplier</span>
          <span class="sidebar__card-value sidebar__card-value--green">1.25x</span>
          <p class="sidebar__card-desc">Impact on probability of getting stronger cards in poker</p>
        </div>
      </aside>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
